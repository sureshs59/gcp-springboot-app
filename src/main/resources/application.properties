spring.application.name=gcp-springboot-app
server.port=8080

# GCP Configuration
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:your-project-id}
spring.cloud.gcp.firestore.database=default

# Cloud Storage
gcp.storage.bucket-name=${GCP_STORAGE_BUCKET:your-bucket-name}
gcp.storage.base-url=https://storage.googleapis.com

# Logging
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Server Configuration
server.compression.enabled=true
server.servlet.context-path=/
